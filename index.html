/* Layout: full-height map console (shared with the NJ Distress Map). Sidebar (activity, applications, players) left, satellite map fills the rest,
   property file slides in over the map's right edge. Dark by design so pins read over imagery. */
:root {
  --ground: #121a23;
  --panel: #18222d;
  --panel-2: #1f2b38;
  --line: #2b3a4a;
  --ink: #e7edf3;
  --ink-2: #a3b1bf;
  --ink-3: #74859a;
  --pin: #47c7ec;          /* tracked commercial */
  --pin-possible: #f0a63a; /* amber accent */
  --pin-land: #9bd86b;     /* vacant land */
  --pin-closed: #8794a3;
  --pin-reo: #c58cff;      /* bank-owned (REO) */
  --alert: #ff5c72;
  --parcel: #ffe066;       /* tax-map yellow, for parcel outlines */
  --ok: #5fd39a;
  --font-head: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--pin); }
:focus-visible { outline: 2px solid var(--pin); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.topbar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: 19px; letter-spacing: .01em; }
.brand .sub { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.stats { display: flex; gap: 18px; margin-left: auto; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; }
.stat b { font-family: var(--font-data); font-weight: 500; font-size: 16px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.stat.hot b { color: var(--alert); }
.layer-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.layer-toggle button { background: none; border: 0; padding: 6px 10px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.layer-toggle button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); }
.panel-btn { display: none; }

.body { position: relative; display: grid; grid-template-columns: 360px 1fr; min-height: 0; }
.side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
.filters { display: grid; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.search { width: 100%; box-sizing: border-box; background: var(--ground); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.search::placeholder { color: var(--ink-3); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); background: none; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--pin)); }
.chip[aria-pressed="true"] { color: var(--ink); background: var(--panel-2); border-color: color-mix(in srgb, var(--c, var(--pin)) 55%, var(--line)); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row select { flex: 1 1 120px; min-width: 0; background: var(--ground); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-2); white-space: nowrap; }

.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 0; font-family: var(--font-head); font-weight: 600; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pin); }
.tabs .count { font-family: var(--font-data); font-weight: 400; margin-left: 4px; color: var(--ink-3); }
.list { flex: 1; overflow-y: auto; min-height: 0; }
.item { display: grid; gap: 3px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 11px 14px; cursor: pointer; }
.item:hover, .item[aria-current="true"] { background: var(--panel-2); }
.item .top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.item .addr { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.item .meta { font-size: 12px; color: var(--ink-2); }
.item .change { font-size: 12px; color: var(--ink); }
.item .when { margin-left: auto; font-size: 11px; color: var(--ink-3); white-space: nowrap; font-family: var(--font-data); }
.unseen { width: 7px; height: 7px; border-radius: 50%; background: var(--alert); flex: none; }
.tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-family: var(--font-head); font-weight: 600; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; background: color-mix(in srgb, var(--t, var(--alert)) 22%, transparent); color: var(--t, var(--alert)); white-space: nowrap; }
.empty { padding: 28px 18px; color: var(--ink-3); font-size: 13px; line-height: 1.5; }
.foot { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 11px; color: var(--ink-3); line-height: 1.5; }
.foot .err { color: var(--alert); }

#map { min-height: 0; height: 100%; background: #0b1016; }
.leaflet-container { font-family: var(--font-body); }
.leaflet-control-attribution { background: rgba(18,26,35,.75) !important; color: var(--ink-3) !important; font-size: 10px; }
.leaflet-control-attribution a { color: var(--ink-2) !important; }
.leaflet-bar a { background: var(--panel) !important; color: var(--ink) !important; border-color: var(--line) !important; }

/* pins */
.pin { position: relative; display: block; width: 16px; height: 16px; }
.pin i { position: absolute; inset: 0; border-radius: 50%; background: var(--c); border: 2px solid #0b1016; box-shadow: 0 0 0 1.5px var(--c), 0 2px 6px rgba(0,0,0,.6); }
.pin.target { --c: var(--pin); }
.pin.possible { --c: var(--pin-possible); }
.pin.land { --c: var(--pin-land); }
.lot-label { background: rgba(18,26,35,.85); border: 1px solid var(--parcel); color: var(--parcel); font-family: var(--font-head); font-size: 11px; font-weight: 600; padding: 1px 5px; box-shadow: none; }
.lot-label::before { display: none; }
.enrich-btn { display: block; width: 100%; margin: 6px 0 4px; padding: 9px 12px; border: 1px solid var(--pin); border-radius: 6px; background: color-mix(in srgb, var(--pin) 14%, transparent); color: var(--ink); font: 600 13px var(--font-head); letter-spacing: .04em; text-transform: uppercase; cursor: pointer; }
.enrich-btn:hover { background: color-mix(in srgb, var(--pin) 26%, transparent); }
.enrich h4 { margin: 12px 0 4px; font: 600 11px var(--font-head); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.enrich .people { list-style: none; margin: 0; padding: 0; }
.enrich .people li { padding: 5px 0; border-bottom: 1px solid var(--line); }
.enrich-note { margin: 6px 0; padding: 7px 9px; border-left: 3px solid var(--pin-possible); background: color-mix(in srgb, var(--pin-possible) 10%, transparent); font-size: 12.5px; }
.enrich table.filings { width: 100%; border-collapse: collapse; font-size: 12px; }
.enrich table.filings td { padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.pin.closed { --c: var(--pin-closed); }
.pin.reo { --c: var(--pin-reo); }
.pin.reo i { border-radius: 2px; transform: rotate(45deg) scale(.92); }
.pin.reo.selected i { transform: rotate(45deg) scale(1.3); }
.pin.reo .flag { background: var(--pin-reo); color: #1b1026; }
.pin.reo .flag::after { border-top-color: var(--pin-reo); }
.pin.reo.alert::before { border-color: var(--pin-reo); border-radius: 4px; transform-origin: center; }
.chip.status i { border-radius: 2px; }
.chip.status[data-status="open"] i { border-radius: 50%; }
.chip.status[data-status="reo"] i { transform: rotate(45deg) scale(.85); }
.reo-box { display: grid; gap: 4px; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--pin-reo) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--pin-reo) 40%, var(--line)); font-size: 13px; }
.reo-box b { color: var(--pin-reo); font-family: var(--font-head); letter-spacing: .04em; text-transform: uppercase; font-size: 12px; }
.pin.alert::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 2px solid var(--alert); animation: pulse 1.8s ease-out infinite; }
#map:not(.show-flags) .pin .flag { display: none; }
.pin .flag { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 2px 7px; border-radius: 3px; background: var(--alert); color: #fff; font-family: var(--font-head); font-weight: 700; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
.pin .flag::after { content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); border: 4px solid transparent; border-top-color: var(--alert); }
.pin.selected i { transform: scale(1.35); }
@keyframes pulse { 0% { transform: scale(.5); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pin.alert::before { animation: none; opacity: .8; } }

/* property file */
.detail { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; width: 380px; max-width: calc(100% - 24px); z-index: 900;

/* ---- JC Board Tracker additions (same system as the Distress Map) ---- */

  --p-ind: #c58cff;      /* industrial, storage, logistics */
  --p-plan: #ff8f6b;     /* redevelopment plans, rezonings */
  --p-other: #8794a3;    /* minor changes, signage, other */
  --p-interim: #ff7ab6;  /* parking lots and other interim / temporary uses */

.pin.interim { --c: var(--p-interim); } .pin.subdiv { --c: var(--p-subdiv); } .pin.appeal { --c: var(--p-appeal); }

.ev-head { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: baseline; padding: 7px 14px 6px; background: var(--panel); border-bottom: 1px solid var(--line); font: 600 11px var(--font-head); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }

<div class="app">
  <header class="topbar">
    <div class="brand"><h1>JC Board Tracker</h1><span class="sub">Jersey City Planning &amp; Zoning Board applications since 2018, live and past</span></div>
    <div class="stats" id="stats"></div>

  </header>
  <div class="body">
    <aside class="side" id="side">
      <div class="filters">

    { key: "interim", cls: "interim", label: "Parking / interim use", c: "var(--p-interim)" },
    { key: "subdiv", cls: "subdiv", label: "Subdivision", c: "var(--p-subdiv)" },
    { key: "plan", cls: "plan", label: "Plans & rezonings", c: "var(--p-plan)" },
    { key: "minor", cls: "other", label: "Minor changes", c: "var(--p-other)" },
    { key: "appeal", cls: "appeal", label: "Appeals", c: "var(--p-appeal)" },

  const statusColor = (p) => ({ approved: "var(--ok)", heard: "var(--pin-possible)", pending: "var(--pin)", closed: "var(--pin-closed)" }[statusKey(p)]);
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const money = (v) => (v == null || v === "" ? "—" : "$" + Math.round(+v).toLocaleString("en-US"));
  const short$ = (v) => { if (v == null || v === "") return "—"; v = +v; return v >= 1e6 ? "$" + (v / 1e6).toFixed(v >= 1e7 ? 1 : 2) + "M" : v >= 1e3 ? "$" + Math.round(v / 1e3) + "K" : "$" + v; };

  const fmtDate = (s) => { const d = parseDay(s); return d && !isNaN(d) ? d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "—"; };

  const MONTHS = { january: 1, february: 2, march: 3, april: 4, may: 5, june: 6, july: 7, august: 8, september: 9, october: 10, november: 11, december: 12 };

  let BOUNDS = null, cityLayer = null, maskLayer = null, wardLayer = null, wardLabels = null;
  let DATA, NOW, LAST_VISIT, map, layers, markers = new Map(), selected = null, outline = null, tab = "activity", ptab = "applicant";
  const state = { exist: "", q: "", board: "", kind: "", ward: "", window: "active", size: 0, statuses: new Set(["pending", "heard", "approved"]), types: new Set(TYPES.map((t) => t.key)) };

  const isNew = (p) => (NOW - parseDay(p.applied)) / 864e5 <= 14;
  const nextHearing = (p) => {
    const m = String(p.agenda_last || "").match(/\bTO\s+([A-Z]+)\s+(\d{1,2}),?\s+(\d{4})/i);
    if (m && MONTHS[m[1].toLowerCase()]) return `${m[3]}-${String(MONTHS[m[1].toLowerCase()]).padStart(2, "0")}-${m[2].padStart(2, "0")}`;
    const up = (p.hearings || []).map((h) => h[0]).filter((d) => parseDay(d) >= NOW - 864e5).sort()[0];
    return up || null;
  };
  const nLots = (p) => (p.parcel_pins || []).length;
  const placeLine = (p) => [p.ward ? "Ward " + p.ward : "", p.lots_label || (p.block ? `Block ${p.block} · Lot ${p.lot}` : "")].filter(Boolean).join(" · ");
  const productLine = (p) => {
    const bits = [];
    if (p.units) bits.push(n0(p.units) + " units");
    if (p.stories) bits.push(p.stories + (p.stories === 1 ? " story" : " stories"));
    if (p.affordable) bits.push(p.affordable + " affordable");
    if (p.hotel_rooms) bits.push(p.hotel_rooms + " hotel rooms");
    if (p.retail_sf) bits.push(n0(p.retail_sf) + " SF retail");
    return bits.join(" · ");
  };
  const boardShort = (p) => (p.board === "zoning" ? "ZBA" : "PB");

  function visible(p, noWindow) {
    if (!state.statuses.has(statusKey(p))) return false;
    if (!state.types.has(p.product)) return false;
    if (state.board && p.board !== state.board) return false;
    if (state.kind && p.kind !== state.kind) return false;
    if (state.ward && p.ward !== state.ward) return false;
    if (state.size && !((p.units || 0) >= state.size)) return false;
    if (noWindow) { /* the activity timeline runs back to 2018 on its own */ }
    else if (state.window === "active") { const d = parseDay(p.applied); if (p.stale || (!["pending", "heard"].includes(statusKey(p)) && !(d && d >= +NOW - 365 * 864e5))) return false; }
    else if (typeof state.window === "string" && /^y\d{4}$/.test(state.window)) { if (!String(p.applied || "").startsWith(state.window.slice(1))) return false; }
    else if (state.window) { const d = parseDay(p.applied); if (!d || d < +NOW - state.window * 864e5) return false; }
    if (state.exist && !(p.existing || []).some((c) => (state.exist === "15" ? /^15/.test(c) : c === state.exist))) return false;
    if (state.q) {
      const hay = [p.id, (p.priors || []).map((q) => q.id + " " + (q.applicant || "")).join(" "), p.address, p.prop_loc, p.applicant, p.attorney, p.owner_mail, p.zone, p.planner, p.block && "block " + p.block, p.kind_label, p.type, p.desc].join(" ").toLowerCase();
      if (!state.q.split(/\s+/).every((w) => hay.includes(w))) return false;
    }
    return true;
  }

  // ---------------------------------------------------------------- map
  function initMap() {
    map = L.map("map", { zoomControl: true, maxZoom: 20 }).setView([40.7178, -74.0631], 13);
    const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 19, maxZoom: 20, attribution: "Imagery © Esri, Maxar, Earthstar Geographics" });
    const roads = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 19, maxZoom: 20, opacity: 0.85 });
    const labels = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 19, maxZoom: 20 });
    const street = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", { subdomains: "abcd", maxZoom: 20, attribution: "© OpenStreetMap contributors © CARTO" });
    layers = { satellite: L.layerGroup([sat, roads, labels]), streets: street };
    const emb = document.getElementById("jc-img");
    if (emb) {
      // claude.ai artifact: outside tiles are blocked, so imagery and street lines are built into the page.
      const I = JSON.parse(emb.textContent);
      const bounds = [[I.bbox[1], I.bbox[0]], [I.bbox[3], I.bbox[2]]];
      const satImg = L.imageOverlay(I.sat, bounds, { attribution: "Imagery © Esri, Maxar, Earthstar Geographics" });
      const roadImg = I.roads ? L.imageOverlay(I.roads, bounds, { opacity: 0.9 }) : null;
      layers = { satellite: L.layerGroup([satImg, roadImg].filter(Boolean)), streets: L.layerGroup([roadImg].filter(Boolean)) };
      map.setMaxBounds(L.latLngBounds(bounds).pad(0.15));
      map.setMinZoom(12);
    }
    layers.satellite.addTo(map);
    // Where outside map tiles are blocked (e.g. a claude.ai artifact), say so once instead of showing a blank map silently.
    let warned = false;
    sat.on("tileerror", () => {
      if (warned || document.getElementById("jc-img")) return;
      warned = true;
      $(".body").insertAdjacentHTML("beforeend", `<div class="sample-banner"><b>Map imagery off</b>Satellite tiles didn't load here. Pins, lists and files still work.</div>`);
    });
    const flags = () => $("#map").classList.toggle("show-flags", map.getZoom() >= 15);
    map.on("zoomend", flags); flags();
    const setLayer = (name) => {
      Object.entries(layers).forEach(([k, l]) => (k === name ? l.addTo(map) : map.removeLayer(l)));
      $("#lyr-sat").setAttribute("aria-pressed", name === "satellite");
      $("#lyr-street").setAttribute("aria-pressed", name === "streets");
      store.set("jcbt:layer", name);
    };
    $("#lyr-sat").onclick = () => setLayer("satellite");
    $("#lyr-street").onclick = () => setLayer("streets");
    if (store.get("jcbt:layer") === "streets") setLayer("streets");
  }

  // ---------------------------------------------------------------- city & ward lines
  const ringsOf = (g) => (g.type === "Polygon" ? [g.coordinates] : g.coordinates);
  function drawCity() {
    if (!BOUNDS || !BOUNDS.city) return;
    map.createPane("bounds"); map.getPane("bounds").style.zIndex = 390; map.getPane("bounds").style.pointerEvents = "none";
    // Dim everything outside the city so the eye stays inside the limits.
    const world = [[-90, -180], [-90, 180], [90, 180], [90, -180]];
    const holes = BOUNDS.city.features.flatMap((f) => ringsOf(f.geometry).map((p) => p[0].map(([x, y]) => [y, x])));
    maskLayer = L.polygon([world, ...holes], { pane: "bounds", stroke: false, fillColor: "#0b1016", fillOpacity: 0.45, interactive: false }).addTo(map);
    cityLayer = L.geoJSON(BOUNDS.city, { pane: "bounds", interactive: false, style: { color: "#e7edf3", weight: 2.5, opacity: 0.9, fill: false } }).addTo(map);
  }
  function drawWard(letter) {
    if (wardLayer) { wardLayer.remove(); wardLayer = null; }
    if (wardLabels) { wardLabels.remove(); wardLabels = null; }
    if (!BOUNDS || !BOUNDS.wards) return;
    const feats = BOUNDS.wards.features;
    if (!letter) return;
    wardLayer = L.layerGroup().addTo(map);
    // Other wards: thin lines for context. Selected ward: bold outline, light fill, dim the rest of the city.
    L.geoJSON({ type: "FeatureCollection", features: feats.filter((f) => f.properties.ward !== letter) }, { pane: "bounds", interactive: false,
      style: { color: "#a3b1bf", weight: 1, opacity: 0.6, dashArray: "4 4", fillColor: "#0b1016", fillOpacity: 0.35 } }).addTo(wardLayer);
    const sel = L.geoJSON({ type: "FeatureCollection", features: feats.filter((f) => f.properties.ward === letter) }, { pane: "bounds", interactive: false,
      style: { color: "#ffe066", weight: 3, opacity: 1, fillColor: "#ffe066", fillOpacity: 0.06 } }).addTo(wardLayer);
    wardLabels = L.layerGroup(feats.map((f) => {
      const c = L.geoJSON(f).getBounds().getCenter();
      return L.marker(c, { interactive: false, icon: L.divIcon({ className: "", html: `<span class="ward-tag${f.properties.ward === letter ? " on" : ""}">Ward ${esc(f.properties.ward)}</span>`, iconSize: [0, 0] }) });
    })).addTo(map);
    const mobile = window.matchMedia("(max-width: 760px)").matches;
    map.fitBounds(sel.getBounds(), { paddingTopLeft: [40, 40], paddingBottomRight: mobile ? [20, map.getSize().y * 0.4] : [selected ? 420 : 40, 40], maxZoom: 16 });
  }

  function pinIcon(p) {
    const t = TYPE[p.product] || TYPE.other;
    const u = p.units || 0;
    const size = u >= 150 ? "huge" : u >= 50 ? "big" : "";
    const px = u >= 150 ? 30 : u >= 50 ? 22 : 16;
    const fresh = isNew(p) && statusKey(p) !== "closed";
    const cls = ["pin", t.cls, size, p.board === "zoning" ? "zba" : "", fresh ? "alert" : "", statusKey(p) === "closed" ? "faded" : "", statusKey(p) === "approved" ? "approved" : "", selected === p.id ? "selected" : ""].join(" ");
    const label = u >= 50 ? `<b>${u}</b>` : "";
    const flag = fresh ? `<span class="flag">Filed ${fmtShort(p.applied)}</span>` : "";
    return L.divIcon({ className: "", html: `<span class="${cls}"><i></i>${label}${flag}</span>`, iconSize: [px, px], iconAnchor: [px / 2, px / 2] });
  }

  function drawMarkers() {
    markers.forEach((m) => m.remove());
    markers.clear();
    // Several cases can share one parcel; draw the most significant on top.
    const rank = (p) => (p.units || 0) + (p.kind === "new" ? 1e4 : 0);
    DATA.cases.filter((p) => p.lat != null && visible(p)).sort((a, b) => rank(a) - rank(b)).forEach((p) => {
      const m = L.marker([p.lat, p.lon], { icon: pinIcon(p), zIndexOffset: (p.units || 0) + (isNew(p) ? 2000 : 0), keyboard: true, title: `${p.id} · ${titleCase(p.address)}` })
        .on("click", () => select(p.id, false)).addTo(map);
      m._p = p;
      markers.set(p.id, m);
    });
  }

  function renderLegend() {
    const seen = new Set(DATA.cases.map((p) => p.product));
    $("#legend").innerHTML = TYPES.filter((t) => seen.has(t.key) && t.key !== "other").map((t) => `<div><i style="--c:${t.c}"></i>${esc(t.label)}</div>`).join("") +
      `<div><i style="--c:var(--ink-2)"></i>Planning Board</div><div><i class="dia"></i>Zoning Board</div><div><i class="okring"></i>Approved</div><div><i class="ring"></i>Filed in last 14 days</div><div style="color:var(--ink-3)">Bigger pin = more units</div>${BOUNDS ? `<div style="color:var(--ink-3)">Pick a ward to outline it</div>` : ""}`;
  }

  // ---------------------------------------------------------------- sidebar
  function renderStats() {
    const live = DATA.cases.filter((p) => statusKey(p) !== "closed" && !p.stale);
    const units = DATA.cases.filter((p) => p.counts_units).reduce((s, p) => s + p.units, 0);
    const newSP = DATA.cases.filter((p) => p.counts_units).length;
    const last30 = DATA.cases.filter((p) => (NOW - parseDay(p.applied)) / 864e5 <= 30).length;
    const approved = DATA.cases.filter((p) => statusKey(p) === "approved").length;
    $("#stats").innerHTML = `
      <div class="stat"><b>${live.length}</b><span>Active</span></div>
      <div class="stat"><b style="color:var(--p-multi)">${n0(units)}</b><span>Units proposed</span></div>
      <div class="stat"><b>${newSP}</b><span>New site plans</span></div>
      <div class="stat hot"><b>${last30}</b><span>Filed · 30 days</span></div>
      <div class="stat"><b style="color:var(--ok)">${approved}</b><span>Approved</span></div>`;
  }

  function renderFilters() {
    const counts = {}; DATA.cases.forEach((p) => (counts[p.product] = (counts[p.product] || 0) + 1));
    $("#type-chips").innerHTML = TYPES.filter((t) => counts[t.key]).map((t) => `<button class="chip" data-type="${t.key}" aria-pressed="${state.types.has(t.key)}" style="--c:${t.c}"><i></i>${t.label}</button>`).join("");
    $("#type-chips").querySelectorAll(".chip").forEach((b) => (b.onclick = () => { const k = b.dataset.type; state.types.has(k) ? state.types.delete(k) : state.types.add(k); b.setAttribute("aria-pressed", state.types.has(k)); refresh(); }));
    $("#status-chips").innerHTML = STATUSES.map((t) => `<button class="chip status" data-status="${t.key}" aria-pressed="${state.statuses.has(t.key)}" style="--c:${t.c}"><i></i>${t.label}</button>`).join("");
    $("#status-chips").querySelectorAll(".chip").forEach((b) => (b.onclick = () => { const k = b.dataset.status; state.statuses.has(k) ? state.statuses.delete(k) : state.statuses.add(k); b.setAttribute("aria-pressed", state.statuses.has(k)); refresh(); }));
    const kc = {}; DATA.cases.forEach((p) => (kc[p.kind] = (kc[p.kind] || 0) + 1));
    $("#kind").insertAdjacentHTML("beforeend", KINDS.filter(([k]) => kc[k]).map(([k, l]) => `<option value="${k}">${l} (${kc[k]})</option>`).join(""));
    const wards = [...new Set(DATA.cases.map((p) => p.ward).filter(Boolean))].sort();
    $("#ward").insertAdjacentHTML("beforeend", wards.map((w) => `<option value="${esc(w)}">Ward ${esc(w)}</option>`).join(""));
    $("#board").onchange = (e) => { state.board = e.target.value; refresh(); };
    $("#kind").onchange = (e) => { state.kind = e.target.value; refresh(); };
    $("#ward").onchange = (e) => { state.ward = e.target.value; refresh(); drawWard(state.ward); if (!state.ward) fitCity(); };
    const yrs = {}; DATA.cases.forEach((p) => { const y = String(p.applied || "").slice(0, 4); if (/^20\d\d$/.test(y)) yrs[y] = (yrs[y] || 0) + 1; });
    $("#window").insertAdjacentHTML("beforeend", Object.keys(yrs).sort().reverse().map((y) => `<option value="y${y}">Filed in ${y} (${yrs[y]})</option>`).join(""));
    $("#window").onchange = (e) => { const v = e.target.value; state.window = v === "active" || /^y\d{4}$/.test(v) ? v : +v || ""; refresh(); };
    const ex = {}; DATA.cases.forEach((p) => (p.existing || []).forEach((c) => { const k = /^15/.test(c) ? "15" : c; ex[k] = (ex[k] || 0) + 1; }));
    $("#exist").insertAdjacentHTML("beforeend", Object.keys(ex).sort((a, b) => (a.length - b.length) || a.localeCompare(b)).map((k) => `<option value="${k}">Existing: ${k === "15" ? "Exempt" : esc(existLabel(k))} (${ex[k]})</option>`).join(""));
    $("#exist").onchange = (e) => { state.exist = e.target.value; refresh(); };
    $("#size").onchange = (e) => { state.size = +e.target.value || 0; refresh(); };
    let t; $("#q").oninput = (e) => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value.trim().toLowerCase(); refresh(); }, 120); };
    const setTab = (name) => {
      tab = name;
      ["activity", "apps", "players"].forEach((k) => $("#tab-" + k).setAttribute("aria-selected", k === name));
      renderList();
    };
    $("#tab-activity").onclick = () => setTab("activity");
    $("#tab-apps").onclick = () => setTab("apps");
    $("#tab-players").onclick = () => setTab("players");
    $("#panel-btn").onclick = () => $("#side").classList.toggle("collapsed");
  }

  function setSearch(text) {
    $("#q").value = text; state.q = text.toLowerCase();
    tab = "apps"; ["activity", "apps", "players"].forEach((k) => $("#tab-" + k).setAttribute("aria-selected", k === "apps"));
    refresh();
    const pts = DATA.cases.filter((p) => p.lat != null && visible(p)).map((p) => [p.lat, p.lon]);
    if (pts.length) map.fitBounds(pts, { padding: [60, 60], maxZoom: 16 });
  }

  // Every dated event on every case that passes the filters (all but the date window), newest first.
  // Upcoming hearings lead. The list renders a page at a time as the reader scrolls back.
  function events() {
    const ev = [];
    const seen = new Set();
    const add = (p, d, kind, extra) => { if (!d) return; const k = p.id + kind + d; if (seen.has(k)) return; seen.add(k); ev.push({ p, d: String(d).slice(0, 10), kind, ...extra }); };
    DATA.cases.forEach((p) => {
      if (!visible(p, true)) return;
      const up = nextHearing(p);
      if (up && parseDay(up) >= NOW - 864e5) add(p, up, "upcoming");
      (p.hearings || []).forEach(([d, b]) => { if (parseDay(d) <= NOW && d !== up) add(p, d, "heard", { board: b }); });
      add(p, p.applied, "filed");
      if (p.approved_on) add(p, p.approved_on, "approved");
      (p.status_history || []).forEach(([st, d, seed]) => {
        if (!d || seed === "seed" && !p.completed) return;
        if (/approved/i.test(st) && p.approved_on) return;
        add(p, d, /approved/i.test(st) ? "approved" : /denied/i.test(st) ? "denied" : /withdrawn|void/i.test(st) ? "withdrawn" : "status", { status: st });
      });
      if (p.completed && !p.approved_on && /denied|withdrawn|void|complete/i.test(p.status || "")) add(p, p.completed, /denied/i.test(p.status) ? "denied" : /withdrawn|void/i.test(p.status) ? "withdrawn" : "status", { status: p.status });
    });
    const up = ev.filter((e) => e.kind === "upcoming").sort((a, b) => a.d.localeCompare(b.d));
    const past = ev.filter((e) => e.kind !== "upcoming" && e.d <= NOW.toISOString().slice(0, 10)).sort((a, b) => b.d.localeCompare(a.d) || (b.p.units || 0) - (a.p.units || 0));
    return [...up, ...past];
  }

  const EV_TAG = {
    upcoming: (e) => `<span class="tag" style="--t:var(--pin-possible)">On agenda ${fmtShort(e.d)}</span>`,
    approved: () => `<span class="tag" style="--t:var(--ok)">Approved</span>`,
    denied: () => `<span class="tag" style="--t:var(--pin-closed)">Denied</span>`,
    withdrawn: () => `<span class="tag" style="--t:var(--pin-closed)">Withdrawn</span>`,
    status: (e) => `<span class="tag" style="--t:${statusColor(e.p)}">${esc(e.status || e.p.status)}</span>`,
    heard: (e) => `<span class="tag" style="--t:var(--pin-possible)">Heard · ${e.board === "Zoning Board" ? "ZBA" : "PB"}</span>`,
    filed: () => `<span class="tag" style="--t:var(--alert)">Filed</span>`,
  };
  const PAGE = 60;
  let feed = [], shown = 0, feedObs = null;
  const monthOf = (d) => (d ? new Date(d.slice(0, 7) + "-15T12:00:00").toLocaleDateString("en-US", { month: "long", year: "numeric" }) : "");

  function feedHtml(from, to) {
    let html = "";
    for (let i = from; i < to && i < feed.length; i++) {
      const e = feed[i], prev = feed[i - 1];
      if (e.kind === "upcoming" && (!prev || prev.kind !== "upcoming")) html += `<div class="ev-head">Coming up</div>`;
      if (e.kind !== "upcoming" && (!prev || prev.kind === "upcoming" || monthOf(prev.d) !== monthOf(e.d))) {
        const n = feedCounts[monthOf(e.d)] || 0;
        html += `<div class="ev-head">${monthOf(e.d)}<span>${n} event${n === 1 ? "" : "s"}</span></div>`;
      }
      const unseen = e.kind === "filed" && LAST_VISIT && e.p.applied > LAST_VISIT.slice(0, 10);
      const when = e.kind === "upcoming" ? "Upcoming" : fmtShort(e.d) + (e.d.slice(0, 4) !== String(NOW.getFullYear()) ? ", " + e.d.slice(0, 4) : "");
      html += itemHtml(e.p, `<div class="top">${unseen ? '<span class="unseen" title="Filed since your last visit"></span>' : ""}${EV_TAG[e.kind](e)}<span class="when">${when}</span></div>`);
    }
    return html;
  }
  let feedCounts = {};

  function renderFeed(list) {
    feed = events();
    feedCounts = {};
    feed.forEach((e) => { if (e.kind !== "upcoming") { const m = monthOf(e.d); feedCounts[m] = (feedCounts[m] || 0) + 1; } });
    shown = Math.min(PAGE, feed.length);
    if (feedObs) feedObs.disconnect();
    $("#n-activity").textContent = feed.length.toLocaleString();
    if (!feed.length) { list.innerHTML = `<div class="empty">No activity for these filters.</div>`; return; }
    const years = [...new Set(feed.filter((e) => e.kind !== "upcoming").map((e) => e.d.slice(0, 4)))];
    list.innerHTML = `<div class="ev-jump">Jump to ${years.map((y) => `<button data-y="${y}">${y}</button>`).join("")}</div>` + feedHtml(0, shown) + `<div class="ev-more" id="ev-more">${feedMoreText()}</div>`;
    wireItems(list);
    list.querySelectorAll(".ev-jump button").forEach((b) => (b.onclick = () => jumpToYear(b.dataset.y)));
    feedObs = new IntersectionObserver((ents) => { if (ents.some((x) => x.isIntersecting)) loadMore(); }, { root: list, rootMargin: "400px" });
    feedObs.observe($("#ev-more"));
  }
  function feedMoreText() {
    if (shown >= feed.length) { const last = feed[feed.length - 1]; return `That's everything${last && last.kind !== "upcoming" ? ` · back to ${fmtDate(last.d)}` : ""}`; }
    const last = feed[shown - 1];
    return `Loading earlier activity… (showing back to ${fmtDate(last.d)})`;
  }
  function loadMore(until) {
    if (shown >= feed.length) return;
    const list = $("#list"), more = $("#ev-more");
    const to = until != null ? Math.max(until + PAGE, shown + PAGE) : shown + PAGE;
    more.insertAdjacentHTML("beforebegin", feedHtml(shown, to));
    shown = Math.min(to, feed.length);
    more.textContent = feedMoreText();
    wireItems(list);
  }
  function jumpToYear(y) {
    const idx = feed.findIndex((e) => e.kind !== "upcoming" && e.d.slice(0, 4) === y);
    if (idx < 0) return;
    if (idx >= shown) loadMore(idx);
    const heads = [...$("#list").querySelectorAll(".ev-head")];
    const h = heads.find((x) => x.textContent.includes(y));
    if (h) $("#list").scrollTop = h.offsetTop - $("#list").offsetTop - 34;
  }
  function wireItems(list) { list.querySelectorAll(".item:not([data-w])").forEach((b) => { b.dataset.w = 1; b.onclick = () => select(b.dataset.id, true); }); }

  function itemHtml(p, top) {
    const t = TYPE[p.product] || TYPE.other;
    return `<button class="item" data-id="${p.id}" aria-current="${selected === p.id}">
      ${top}
      <div class="addr">${esc(titleCase(p.address) || p.id)}</div>
      <div class="meta"><span class="tag" style="--t:${t.c}">${esc(boardShort(p))}</span>${nLots(p) > 1 ? ` <span class="tag" style="--t:var(--parcel)">${nLots(p)} lots</span>` : ""} ${esc(p.kind_label)} · ${esc(placeLine(p) || "No parcel")}</div>
      ${(p.existing || []).length || (p.tracked_because && p.tracked_because !== "filed") ? `<div class="meta">${(p.existing || []).length ? `<span class="exist" title="Current tax class of the lot">Existing: ${esc(existText(p))}</span>` : ""}${p.tracked_because && p.tracked_because !== "filed" ? ` <span class="exist" style="color:var(--pin-possible)">${esc(TRACKED[p.tracked_because] || "Filed earlier")}</span>` : ""}</div>` : ""}
      ${p.priors && p.priors.length && (p.kind === "ext" || p.kind === "amend") ? `<div class="meta" style="color:var(--ink-3)">${p.kind === "ext" ? "Extends" : "Amends"} ${esc(p.priors.map((q) => q.id).join(", "))}</div>` : ""}
      ${productLine(p) || p.applicant ? `<div class="change">${esc(productLine(p))}${productLine(p) && p.applicant ? " · " : ""}${p.applicant ? esc(p.applicant) : ""}</div>` : ""}
    </button>`;
  }

  function players() {
    const key = ptab === "applicant" ? (p) => p.applicant : ptab === "attorney" ? (p) => p.attorney : (p) => p.owner_mail;
    const g = new Map();
    DATA.cases.forEach((p) => {
      if (!visible(p)) return;
      const k = (key(p) || "").trim(); if (!k) return;
      const id = k.toUpperCase().replace(/[.,]/g, "").replace(/\s+/g, " ");
      const r = g.get(id) || { name: k, cases: [], units: 0, mix: {} };
      r.cases.push(p); if (p.counts_units) r.units += p.units; r.mix[p.product] = (r.mix[p.product] || 0) + 1;
      g.set(id, r);
    });
    return [...g.values()].filter((r) => ptab !== "owner" || r.cases.length > 1).sort((a, b) => b.cases.length - a.cases.length || b.units - a.units || a.name.localeCompare(b.name));
  }

  function renderList() {
    const vis = DATA.cases.filter(visible);
    const pl = players();
    $("#n-activity").textContent = "";
    $("#n-apps").textContent = vis.length;
    $("#n-players").textContent = pl.length;
    const fn = $("#filter-note");
    if (state.q) { fn.hidden = false; fn.innerHTML = `Showing matches for “${esc(state.q)}” <button id="clear-q">Clear</button>`; $("#clear-q").onclick = () => { $("#q").value = ""; state.q = ""; refresh(); }; } else fn.hidden = true;
    const list = $("#list");
    if (tab === "activity") {
      renderFeed(list);
      return;
    } else if (tab === "apps") {
      const sorted = vis.slice().sort((a, b) => b.applied.localeCompare(a.applied) || b.id.localeCompare(a.id));
      list.innerHTML = sorted.length ? sorted.map((p) => itemHtml(p, `<div class="top"><span class="mono" style="font-size:11.5px;color:var(--ink-2)">${p.id}</span><span class="tag" style="--t:${statusColor(p)}">${esc(p.status)}</span><span class="when">${fmtShort(p.applied)}</span></div>`)).join("")
        : `<div class="empty">No applications match these filters.</div>`;
    } else {
      const label = { applicant: "applicant", attorney: "attorney", owner: "owner mailing address" }[ptab];
      list.innerHTML = `<div class="seg" role="group" aria-label="Group players by">
          <button data-p="applicant" aria-pressed="${ptab === "applicant"}">Applicants</button>
          <button data-p="attorney" aria-pressed="${ptab === "attorney"}">Attorneys</button>
          <button data-p="owner" aria-pressed="${ptab === "owner"}">Repeat owners</button></div>` +
        (pl.length ? pl.map((r) => `<button class="player" data-name="${esc(r.name)}">
            <span class="nm">${esc(ptab === "owner" ? titleCase(r.name) : r.name)}</span><span class="ct">${r.cases.length}</span>
            <span class="meta"><span class="mix">${TYPES.filter((t) => r.mix[t.key]).map((t) => `<i style="background:${t.c};width:${(100 * r.mix[t.key]) / r.cases.length}%"></i>`).join("")}</span>${r.units ? `${n0(r.units)} new units` : ""}${r.units ? " · " : ""}${esc(r.cases.slice(0, 2).map((c) => titleCase(c.address)).join("; "))}${r.cases.length > 2 ? "…" : ""}</span>
          </button>`).join("") : `<div class="empty">No ${label}s on record for these filters.</div>`) +
        `<div class="empty" style="padding-top:12px">${ptab === "owner" ? "Owner names are withheld from the state's public tax data, so sites are grouped by the tax bill's mailing address. Two or more sites with the same address usually means one owner." : "Applicant and attorney names come from the board agendas, so they appear once a case is scheduled for a hearing."}</div>`;
      list.querySelectorAll(".seg button").forEach((b) => (b.onclick = () => { ptab = b.dataset.p; renderList(); }));
      list.querySelectorAll(".player").forEach((b) => (b.onclick = () => setSearch(b.dataset.name)));
      return;
    }
    list.querySelectorAll(".item").forEach((b) => (b.onclick = () => select(b.dataset.id, true)));
  }

  function renderFoot() {
    const located = DATA.cases.filter((p) => p.lat != null).length;
    const named = DATA.cases.filter((p) => p.applicant).length;
    const ndocs = DATA.cases.reduce((s, p) => s + (p.n_docs != null ? p.n_docs : (p.docs || []).length), 0);
    $("#foot").innerHTML = `Last change ${new Date(DATA.generated_at).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })} · checks the city portal and new board agendas every 6 hours<br>${DATA.cases.length} cases · ${ndocs.toLocaleString()} documents · ${located} mapped · ${named} with applicant named` +
      `<br>Sources: Jersey City permit portal (2018 on), Planning &amp; Zoning Board agendas 2016 on (JC Open Data), NJ MOD-IV tax data (NJOGIS). Units, stories and affordable counts are read from each application's description. Verify before relying on figures.`;
  }

  // ---------------------------------------------------------------- application file
  const DOC_KIND = [[/site ?plan|architect|drawing|plans?\b|elevation|floor plan/i, "Plans", 1], [/survey/i, "Survey", 1], [/staff memo|staff report/i, "Staff memo", 1],
    [/traffic/i, "Traffic", 1], [/storm ?water|drainage/i, "Stormwater", 1], [/render/i, "Rendering", 1], [/resolution|memorializ/i, "Resolution", 1],
    [/affordable|\bAH\b/i, "Affordable", 0], [/notice|proof of service|200.?f(oo)?t|affidavit/i, "Notice", 0], [/forestry|jcmua|fire|engineering|review/i, "Review", 0],
    [/tax cert/i, "Tax cert", 0], [/demolition/i, "Demolition", 0], [/application|checklist|zoning (chart|table)/i, "Application", 0]];
  function docKind(d) { const t = d.name + " " + d.note; const k = DOC_KIND.find(([re]) => re.test(t)); return k ? { label: k[1], key: !!k[2] } : null; }
  const mb = (b) => (b >= 1e6 ? (b / 1e6).toFixed(b >= 1e7 ? 0 : 1) + " MB" : Math.max(1, Math.round(b / 1e3)) + " KB");
  function docRow(d, link) {
    const k = docKind(d);
    const name = `${k ? `<span class="doc-kind${k.key ? " key" : ""}">${esc(k.label)}</span>` : ""}${esc(d.name)}`;
    return `<li><span class="fn">${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">${name}</a>` : link ? `<a href="${link}" target="_blank" rel="noopener" title="Opens the case's file list on the city portal">${name}</a> <span class="note">· on city portal</span>` : name}</span><span class="dt">${[d.size ? mb(d.size) : "", d.added ? fmtShort(d.added) : ""].filter(Boolean).join(" · ")}</span>${d.note ? `<span class="nt">${esc(d.note)}</span>` : ""}</li>`;
  }
  function docsHtml(p) {
    const docs = p.docs || [];
    const link = `${PORTAL}${esc(p.case_id)}?tab=attachments`;
    if (!docs.length) return `<div class="sec"><h3>Documents</h3><p class="note">No public documents posted yet. They usually appear once the application is deemed complete. <a href="${link}" target="_blank" rel="noopener">Check the city portal</a></p></div>`;
    const rank = (d) => (docKind(d)?.key ? 1 : 0);
    const cur = docs.filter((d) => d.current).sort((a, b) => rank(b) - rank(a) || b.added.localeCompare(a.added));
    const old = docs.filter((d) => !d.current).sort((a, b) => b.added.localeCompare(a.added));
    const head = cur.length ? `<ul class="docs">${cur.map((d) => docRow(d, link)).join("")}</ul>` : `<ul class="docs">${old.splice(0, 8).map((d) => docRow(d, link)).join("")}</ul>`;
    const rest = old.length ? `<details style="margin-top:6px"><summary>Earlier versions and other uploads (${old.length})</summary><ul class="docs" style="margin-top:6px">${old.map((d) => docRow(d, link)).join("")}</ul></details>` : "";
    return `<div class="sec"><h3>Documents · ${cur.length ? cur.length + " current" : docs.length}</h3>${head}${rest}
      <p class="note" style="margin:6px 0 0">${cur.length ? "Click a file to download the current version. " : ""}<a href="${link}" target="_blank" rel="noopener">All files on the city portal</a></p></div>`;
  }

  function priorsHtml(p) {
    const ps = (p.priors || []).slice().sort((a, b) => (a.applied || "9").localeCompare(b.applied || "9"));
    if (!ps.length) return "";
    return ps.map((q, i) => {
      const docs = (q.docs || []).slice().sort((a, b) => (b.current ? 1 : 0) - (a.current ? 1 : 0) || (docKind(b)?.key ? 1 : 0) - (docKind(a)?.key ? 1 : 0));
      const shown = docs.slice(0, 8), more = docs.slice(8);
      const fig = productLine(q);
      const links = [q.case_id ? `<a href="${PORTAL}${esc(q.case_id)}?tab=attachments" target="_blank" rel="noopener">City portal</a>` : "",
        q.odp ? `<a href="https://data.jerseycitynj.gov/explore/dataset/${esc(q.odp)}/information/" target="_blank" rel="noopener">Open Data archive</a>` : ""].filter(Boolean).join(" · ");
      return `<div class="sec prior"><h3>${i === 0 ? "Original approval" : "Related filing"} · ${esc(q.id)}</h3>${q.same_site === false ? `<p class="note" style="margin:0 0 6px;color:var(--pin-possible)">Cited in this application, but the city's record for ${esc(q.id)} is at a different address. Not used for this project's size or type.</p>` : ""}
        <dl class="kv">
          <dt>Case</dt><dd><span class="mono">${esc(q.id)}</span>${q.type ? " · " + esc(q.type) : ""}</dd>
          ${q.status ? `<dt>Status</dt><dd>${esc(q.status)}</dd>` : ""}
          ${q.applied ? `<dt>Filed</dt><dd>${fmtDate(q.applied)}</dd>` : ""}
          ${q.address ? `<dt>Address</dt><dd>${esc(titleCase(q.address))}</dd>` : ""}
          ${fig ? `<dt>Project</dt><dd><b>${esc(fig)}</b></dd>` : ""}
          ${q.applicant ? `<dt>Applicant</dt><dd>${esc(q.applicant)}</dd>` : ""}
          ${q.attorney ? `<dt>Attorney</dt><dd>${esc(q.attorney)}</dd>` : ""}
        </dl>
        ${q.desc ? `<details style="margin-top:6px"><summary>What was approved</summary><p>${esc(q.desc)}</p></details>` : ""}
        ${docs.length ? `<ul class="docs" style="margin-top:8px">${shown.map((d) => docRow(d)).join("")}</ul>${more.length ? `<details style="margin-top:6px"><summary>${more.length} more files</summary><ul class="docs" style="margin-top:6px">${more.map((d) => docRow(d)).join("")}</ul></details>` : ""}` : `<p class="note">No documents posted online for this case.</p>`}
        ${links ? `<p class="note" style="margin:6px 0 0">${links}</p>` : ""}
      </div>`;
    }).join("");
  }

  function copyBtn(text) { return `<button class="copy" data-copy="${esc(text)}" aria-label="Copy ${esc(text)}">Copy</button>`; }

  const STEPS = [["filed", "Filed"], ["review", "Staff review"], ["scheduled", "Scheduled"], ["heard", "Heard"], ["approved", "Approved"]];
  function stagesHtml(p) {
    if (!p.stage) return "";
    // Dates come from the record itself; a stage-history date counts only when the tracker saw the case move
    // (first sightings, and everything recorded Nov 16-17, 2026 when every case was first loaded, carry none).
    const when = {}; (p.stage_history || []).forEach(([st, d], i) => { if (i > 0 && d && d > "2026-11-17" && !when[st]) when[st] = d; });
    const past = (p.hearings || []).map((h) => h[0]).filter((d) => d && parseDay(d) <= NOW).sort();
    if (past.length) { when.heard = when.heard || past[past.length - 1]; when.scheduled = when.scheduled || past[0]; }
    const stop = ["denied", "withdrawn"].includes(p.stage);
    const at = stop ? -1 : STEPS.findIndex((x) => x[0] === p.stage);
    const items = STEPS.map(([k, l], i) => {
      const cls = i < at ? "done" : i === at ? "now" : "";
      const d = k === "filed" ? p.applied : k === "scheduled" && p.next_hearing ? p.next_hearing : k === "approved" ? (p.approved_on || when.approved || (p.status_group === "approved" ? p.completed : null)) : when[k];
      return `<li class="${cls}">${l}${d && (i <= at || k === "scheduled") ? `<time>${fmtDate(d)}</time>` : ""}</li>`;
    });
    if (stop) items[4] = `<li class="now">${p.stage === "denied" ? "Denied" : "Withdrawn"}${p.completed ? `<time>${fmtDate(p.completed)}</time>` : ""}</li>`;
    const sup = p.superseded_by && DATA.cases.find((x) => x.id === p.superseded_by);
    if (sup) return `<div class="sec"><h3>Where it is now · Replaced by a later filing</h3><p class="note" style="margin:0 0 6px">The city portal still lists this case as "${esc(p.status)}", but a later application for the same property has since been decided, so this one was most likely dropped in its favor.</p><button class="linkish" data-id="${sup.id}"><span class="mono">${sup.id}</span> · filed ${fmtDate(sup.applied)} · <span style="color:${statusColor(sup)}">${esc(sup.status)}</span>${sup.units ? ` · ${n0(sup.units)} units` : ""}</button></div>`;
    const quiet = p.quiet ? `<p class="note" style="margin:6px 0 0">Quiet since ${fmtDate(p.last_activity)}: no hearing, document, related filing or news on this property in over a year. It still counts as active until the city closes it or a later filing replaces it.</p>`
      : p.last_activity && ["filed", "review", "heard"].includes(p.stage) ? `<p class="note" style="margin:6px 0 0">Last activity ${fmtDate(p.last_activity)}${p.news_last && p.news_last === p.last_activity ? " (news coverage)" : ""}</p>` : "";
    return `<div class="sec"><h3>Where it is now · ${esc(p.stage_label)}</h3><ol class="stages${stop ? " stop" : ""}" style="padding:0;margin:0">${items.join("")}</ol>
      ${p.next_hearing ? `<p class="note" style="margin:6px 0 0">Next hearing ${fmtDate(p.next_hearing)} · ${p.board === "zoning" ? "Zoning Board" : "Planning Board"}</p>` : ""}${quiet}</div>`;
  }

  // Coverage of this property in Jersey Digs, ROI-NJ, Real Estate NJ and Traded (matched by street address).
  function newsHtml(p) {
    const rows = p.news || [];
    if (!rows.length) return `<div class="sec"><h3>In the news</h3><p class="note" style="margin:0">No coverage of this address found in Jersey Digs, ROI-NJ, Real Estate NJ or Traded.</p></div>`;
    const li = rows.slice(0, 12).map((a) => `<li><div class="nmeta">${a.date ? fmtDate(a.date) + " · " : ""}${esc(a.src)}</div><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a>${a.blurb ? `<div class="nblurb">${esc(a.blurb)}</div>` : ""}</li>`).join("");
    const more = rows.slice(12).map((a) => `<li><div class="nmeta">${a.date ? fmtDate(a.date) + " · " : ""}${esc(a.src)}</div><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></li>`).join("");
    return `<div class="sec"><h3>In the news · ${p.n_news || rows.length} article${(p.n_news || rows.length) === 1 ? "" : "s"}</h3><ul class="news">${li}</ul>${more ? `<details><summary class="note">${rows.length - 12} more</summary><ul class="news">${more}</ul></details>` : ""}</div>`;
  }

  function salesHtml(p) {
    const rows = p.sales || [];
    if (!p.sales_checked && !rows.length) return `<div class="sec"><h3>Ownership &amp; sales</h3><p class="note">Not looked up yet. Deed records for each lot are pulled a few hundred lots per update, so this fills in within a few days.</p></div>`;
    if (!rows.length) return `<div class="sec"><h3>Ownership &amp; sales</h3><p class="note">No deeds or mortgages found on these lots in the county index.</p></div>`;
    const deeds = rows.filter((r) => /deed/i.test(r.type) && !/mortgage/i.test(r.type));
    const priced = deeds.filter((r) => r.price > 100);
    const fmtNames = (r) => (r.from || r.to ? `${esc(titleCase(r.from || "—"))} → ${esc(titleCase(r.to || "—"))}` : `<span class="note">names withheld in state file</span>`);
    return `<div class="sec"><h3>Ownership &amp; sales · ${deeds.length} transfer${deeds.length === 1 ? "" : "s"}</h3>
      <p class="note" style="margin:0 0 6px">${priced.length ? `Last priced sale ${money(priced[0].price)} · ${fmtDate(priced[0].date)}. ` : ""}Deeds and mortgages recorded with the Hudson County Register; prices from the NJ state sales file (2020 on).${nLots(p) > 1 ? ` Covers all ${nLots(p)} lots.` : ""}</p>
      <div class="sales-wrap"><table class="sales"><thead><tr><th>Recorded</th><th>Document</th><th>From → to</th><th>Price</th></tr></thead><tbody>
      ${rows.map((r) => `<tr class="${/mortgage/i.test(r.type) ? "mort" : ""}"><td class="n">${fmtDate(r.date)}</td><td>${esc(r.type)}${r.bookpage ? `<div class="note mono">Bk/Pg ${esc(r.bookpage)}</div>` : ""}${nLots(p) > 1 && r.pin ? `<div class="note">Lot ${esc(r.pin.split("_").slice(2).join("."))}</div>` : ""}</td><td>${fmtNames(r)}</td><td class="n">${r.price != null ? money(r.price) : "—"}${r.price != null && r.usable === false ? `<div class="note" title="State code: this price may not reflect market value">non-market${r.nu ? " (" + esc(r.nu) + ")" : ""}</div>` : ""}${r.n_lots > 1 ? `<div class="note">${r.n_lots}-lot deed</div>` : ""}</td></tr>`).join("")}
      </tbody></table></div></div>`;
  }

  const shardCache = {};
  async function ensureDetail(p) {
    if (p._full || p.shard == null || p.docs) { p._full = true; return; }
    try {
      shardCache[p.shard] = shardCache[p.shard] || fetch(`data/detail/${p.shard}.json`).then((r) => r.json());
      const d = (await shardCache[p.shard])[p.id] || {};
      Object.assign(p, { docs: d.docs || [], priors: d.priors || p.priors, sales: d.sales || [], news: d.news || [] });
      p._full = true;
    } catch { delete shardCache[p.shard]; }
  }

  // ---------------------------------------------------------------- same property
  const SFX = { STREET: "ST", AVENUE: "AVE", AV: "AVE", BOULEVARD: "BLVD", DRIVE: "DR", PLACE: "PL", ROAD: "RD", PLAZA: "PLZ", SQUARE: "SQ", TERRACE: "TER", COURT: "CT", LANE: "LN", PARKWAY: "PKWY", HIGHWAY: "HWY" };
  const SFXV = new Set(Object.values(SFX));
  const ALIAS = { "CHRISTOPHER COLUMBUS": "COLUMBUS", "JOHN F KENNEDY": "KENNEDY", JFK: "KENNEDY", "MARTIN LUTHER KING": "MLK", "MARTIN LUTHER KING JR": "MLK", "DR MARTIN LUTHER KING JR": "MLK" };
  function siteAddr(a) {
    const w = String(a || "").toUpperCase().split(/\bUNIT\b|,|\bJERSEY CITY\b/)[0].replace(/[.#]/g, " ").split(/\s+/).filter(Boolean);
    if (w.length < 2 || !/^\d+/.test(w[0])) return null;
    let rest = w.slice(1).map((x) => SFX[x] || x);
    if (SFXV.has(rest[rest.length - 1])) rest = rest.slice(0, -1);
    let name = rest.join(" "); name = ALIAS[name] || name;
    return name ? w[0].match(/^\d+/)[0] + " " + name : null;
  }
  const lotKeys = (p) => { const pins = (p.parcel_pins && p.parcel_pins.length ? p.parcel_pins : [p.pams_pin]).filter(Boolean); return pins.length <= 12 ? pins.map((x) => x.split("_").slice(0, 3).join("_")) : []; };
  let SITE_INDEX = null;
  function siteOthers(p) {
    if (p.site_ids) { const c = citedIds(p).map((id) => DATA.cases.find((x) => x.id === id)).filter(Boolean); return [...c, ...p.site_ids.map((id) => DATA.cases.find((x) => x.id === id)).filter((x) => x && !c.includes(x))]; }
    if (!SITE_INDEX) {
      SITE_INDEX = new Map();
      DATA.cases.forEach((x) => { if (x.kind === "plan" && (x.parcel_pins || []).length > 12) return; [...lotKeys(x).map((k) => "L" + k), siteAddr(x.address) && "A" + siteAddr(x.address)].filter(Boolean).forEach((k) => { if (!SITE_INDEX.has(k)) SITE_INDEX.set(k, new Set()); SITE_INDEX.get(k).add(x); }); });
    }
    const out = new Set();
    [...lotKeys(p).map((k) => "L" + k), siteAddr(p.address) && "A" + siteAddr(p.address)].filter(Boolean).forEach((k) => (SITE_INDEX.get(k) || []).forEach((x) => { if (x !== p) out.add(x); }));
    const cited = citedIds(p).map((id) => DATA.cases.find((x) => x.id === id)).filter(Boolean);
    return [...cited, ...[...out].filter((x) => !cited.includes(x)).sort((a, b) => (b.applied || "").localeCompare(a.applied || ""))];
  }
  // Case numbers a description cites, normalized the way the city numbers them: P21-003, P2023-0059.
  function citedIds(p) {
    if (p.cites) return p.cites;
    const out = [], re = /(?<![A-Za-z0-9])(?:Case\s*(?:No\.?|Number|#)?\s*)?([PZ])?\s?-?\s?(20\d{2}|\d{2})\s?-\s?(\d{2,4})(?![\d-])/gi;
    let m; const t = p.desc || "";
    while ((m = re.exec(t))) {
      let L = (m[1] || "").toUpperCase();
      if (!L && !/case/i.test(t.slice(Math.max(0, m.index - 12), m.index + m[0].length))) continue;
      L = L || p.id[0];
      const id = m[2].length === 4 ? `${L}${m[2]}-${String(+m[3]).padStart(4, "0")}` : `${L}${m[2]}-${String(+m[3]).padStart(3, "0")}`;
      if (id !== p.id && !out.includes(id)) out.push(id);
    }
    return out;
  }
  function buildsOn(p) {
    const citedFirst = citedIds(p).map((id) => DATA.cases.find((x) => x.id === id)).find(Boolean);
    if (citedFirst && ["amend", "ext"].includes(p.kind)) return citedFirst;
    if (p.builds_on !== undefined) return p.builds_on ? DATA.cases.find((x) => x.id === p.builds_on) || { id: p.builds_on, external: true } : null;
    if (!(["amend", "ext"].includes(p.kind) || /previously approved|prior approval|approved (site plan|project)/i.test(p.desc || ""))) return null;
    const cited = citedIds(p).map((id) => DATA.cases.find((x) => x.id === id)).find(Boolean);
    if (cited) return cited;
    const named = (p.priors || []).find((q) => q.same_site !== false);
    if (named) return DATA.cases.find((x) => x.id === named.id) || { id: named.id, external: true };
    const earlier = siteOthers(p).filter((q) => (q.applied || "") < (p.applied || "9"));
    const appr = earlier.filter((q) => q.status_group === "approved");
    return appr.find((q) => q.kind === "new") || appr[0] || earlier[0] || null;
  }
  function siteHtml(p) {
    const others = siteOthers(p), base = buildsOn(p);
    if (!others.length && !base && !citedIds(p).length) return `<div class="sec"><h3>This property</h3><p class="note" style="margin:0">No other Planning or Zoning Board filings on this lot since 2018.${["amend", "ext"].includes(p.kind) ? " The approval this changes is older than the city's online records (before 2018); ask the Division of City Planning for the resolution." : ""}</p></div>`;
    let box = "";
    if (base && !base.external) {
      const blink = `${PORTAL}${esc(base.case_id)}?tab=attachments`;
      let cur = (base.docs || []).filter((d) => d.current).sort((a, b) => (docKind(b)?.key ? 1 : 0) - (docKind(a)?.key ? 1 : 0)).slice(0, 6);
      if (!cur.length) cur = (base.docs || []).slice().sort((a, b) => (b.added || "").localeCompare(a.added || "")).slice(0, 6);
      box = `<div class="prior" style="margin-bottom:10px">
        <div style="font-size:12px;color:var(--ink-3);margin-bottom:3px">${base.status_group === "approved" || citedIds(p).includes(base.id) ? (p.kind === "ext" ? "Approval this extends" : "Approval this modifies") + (citedIds(p).includes(base.id) ? " (cited in the application)" : "") : "Earlier filing this follows"}${citedIds(p).includes(base.id) && base.status_group !== "approved" ? `<div class="note">The city portal still lists ${esc(base.id)} as "${esc(base.status)}"; it was never closed out online.</div>` : ""}</div>
        <button class="linkish" data-id="${base.id}"><span class="mono">${base.id}</span> · ${esc(base.kind_label)} · <span style="color:${statusColor(base)}">${esc(base.status)}</span></button>
        <div class="note">Filed ${fmtDate(base.applied)}${base.units ? ` · ${n0(base.units)} units` : ""}${base.stories ? ` · ${base.stories} stories` : ""}</div>
        ${base.desc ? `<p class="desc" style="font-size:12.5px;margin:4px 0 6px">${esc(base.desc.slice(0, 260))}${base.desc.length > 260 ? "…" : ""}</p>` : ""}
        ${base._full ? (cur.length ? `<ul class="docs">${cur.map((d) => docRow(d, blink)).join("")}</ul>${(base.docs || []).length > cur.length ? `<p class="note" style="margin:4px 0 0">${(base.docs || []).length - cur.length} more files · <a href="${blink}" target="_blank" rel="noopener">all files on the city portal</a></p>` : ""}${(base.docs || []).length <= 3 ? `<p class="note" style="margin:4px 0 0">Few files are posted online for ${base.id}; its approved plans and resolution may be on paper at the Division of City Planning.</p>` : ""}` : `<p class="note" style="margin:0">No documents posted online for ${base.id}.</p>`) : `<p class="note" style="margin:0">Loading its documents…</p>`}
      </div>`;
    } else if (base && base.external) {
      box = `<p class="note" style="margin:0 0 8px">Builds on <span class="mono">${esc(base.id)}</span>, shown under Property history below.</p>`;
    }
    const missing = citedIds(p).filter((id) => !DATA.cases.some((x) => x.id === id) && !(p.priors || []).some((q) => q.id === id));
    if (missing.length) box += `<p class="note" style="margin:0 0 8px">Cites ${missing.map((x) => `<span class="mono">${esc(x)}</span>`).join(", ")}, which isn't in the city's online records${missing.length > 1 ? "" : ""}.</p>`;
    const rows = others.slice(0, 25).map((x) => `<button data-id="${x.id}"><span class="mono">${x.id}</span> · ${esc(x.kind_label)}${x.units ? ` · ${n0(x.units)} units` : ""} <span class="note">· filed ${fmtShort(x.applied)}${(x.applied || "").slice(0, 4) !== String(NOW.getFullYear()) ? ", " + (x.applied || "").slice(0, 4) : ""}</span><span class="tag" style="--t:${statusColor(x)};float:right">${esc(x.status)}</span></button>`).join("");
    return `<div class="sec"><h3>This property · ${others.length} other filing${others.length === 1 ? "" : "s"}</h3>${box}${others.length ? `<div class="related">${rows}</div>${others.length > 25 ? `<p class="note">and ${others.length - 25} more</p>` : ""}` : ""}</div>`;
  }

  function renderDetail(p) {
    const t = TYPE[p.product] || TYPE.other;
    const ll = p.lat != null ? `${p.lat},${p.lon}` : encodeURIComponent(`${p.address}, Jersey City, NJ`);
    const related = DATA.cases.filter((x) => x.id !== p.id && ((p.pams_pin && x.pams_pin === p.pams_pin) || (p.address && x.address === p.address)));
    const sameMail = p.owner_mail ? DATA.cases.filter((x) => x.id !== p.id && x.owner_mail && x.owner_mail.toUpperCase() === p.owner_mail.toUpperCase() && !related.includes(x)) : [];
    const up = nextHearing(p);
    const hist = [...(p.hearings || []).map(([d, b]) => [`${parseDay(d) > NOW ? "Scheduled" : "On agenda"} · ${b}`, d]), ["Filed", p.applied]];
    if (up && !(p.hearings || []).some((h) => h[0] === up)) hist.unshift([`Next hearing · ${p.board === "zoning" ? "Zoning Board" : "Planning Board"}`, up]);
    (p.status_history || []).forEach((h) => { if (h[1]) hist.push([`Status: ${h[0]}`, h[1]]); });
    if (p.completed && !(p.status_history || []).some((h) => h[1] === p.completed)) hist.push([p.status, p.completed]);
    hist.sort((a, b) => b[1].localeCompare(a[1]));
    const inh = (k) => ((p.inherited || []).includes(k) ? ` <span class="note">· ${esc(p.inherited_from)}</span>` : "");
    const figs = [["Units" + inh("units"), p.units ? n0(p.units) : "—"], ["Stories" + inh("stories"), p.stories || "—"],
      p.hotel_rooms ? ["Hotel rooms", p.hotel_rooms] : p.affordable ? ["Affordable", p.affordable] : ["Parking", p.parking != null ? n0(p.parking) : "—"]];
    const affPct = p.units && p.affordable ? Math.round((100 * p.affordable) / p.units) : null;
    $("#detail").innerHTML = `
      <div class="d-head">
        <button class="x" id="d-close" aria-label="Close">×</button>
        <h2>${esc(titleCase(p.address) || "Location not listed")}</h2>
        <div class="where">${esc(placeLine(p))}${p.zone ? " · " + esc(p.zone) : ""}</div>
        <div class="tags"><span class="tag" style="--t:${t.c}" title="${esc(basisText(p))}">${esc(t.label)}</span><span class="tag" style="--t:var(--ink-2)">${p.board === "zoning" ? "Zoning Board" : "Planning Board"} · ${esc(p.kind_label)}</span><span class="tag" style="--t:${statusColor(p)}">${esc(p.status)}</span></div>
      </div>
      <div class="d-body">
        ${up && parseDay(up) >= NOW - 864e5 ? `<div class="alerts-box"><div><b>On the ${p.board === "zoning" ? "Zoning" : "Planning"} Board agenda ${fmtDate(up)}</b></div>${p.agenda_last ? `<small>${esc(p.agenda_last)}</small>` : ""}</div>` : ""}
        ${statusKey(p) === "approved" ? `<div class="reo-box" style="--pin-reo:var(--ok)"><b>Approved${p.approved_on ? " " + fmtDate(p.approved_on) : ""}</b><div>${esc(p.type)}${p.approval_expires ? " · approval expires " + fmtDate(p.approval_expires) : ""}</div></div>` : ""}
        ${stagesHtml(p)}
        <div class="basis">${p.product_basis && p.product_basis !== "this application" ? `Type: <b>${esc(t.label)}</b>, from ${esc(p.product_basis)}${(p.priors || []).some((q) => q.id === p.product_basis) ? " (the approval this " + (p.kind === "ext" ? "extends" : "amends") + ")" : " (the project on this lot)"}` : ""}${(p.existing || []).length ? `${p.product_basis && p.product_basis !== "this application" ? " · " : ""}Existing lot: <b>${esc(existText(p))}</b>` : ""}${p.tracked_because && p.tracked_because !== "filed" ? ` · <span style="color:var(--pin-possible)">${esc(TRACKED[p.tracked_because] || "")}</span>` : ""}</div>
        <div class="figs">${figs.map(([k, v]) => `<div class="fig"><span>${k}</span><b>${esc(v)}</b></div>`).join("")}</div>
        ${p.inherited_from ? `<p class="note" style="margin:-8px 0 0">Project size from the earlier approval ${esc(p.inherited_from)}, which this ${p.kind === "ext" ? "extends" : "amends"}.</p>` : ""}
        ${affPct != null ? `<div class="meter"><div><b>${affPct}%</b> of units affordable (${p.affordable} of ${n0(p.units)})</div><div class="bar"><i style="width:${Math.min(affPct, 100)}%;--fill:var(--ok)"></i></div></div>` : ""}
        <div class="sec"><h3>What's proposed</h3><p class="desc">${esc(p.desc || "No description filed.")}</p>
          ${p.retail_sf || (p.parking != null && figs[2][0] !== "Parking") ? `<p class="note" style="margin:8px 0 0">${[p.retail_sf ? n0(p.retail_sf) + " SF retail/commercial" : "", p.parking != null && figs[2][0] !== "Parking" ? n0(p.parking) + " parking spaces" : ""].filter(Boolean).join(" · ")}</p>` : ""}</div>
        ${siteHtml(p)}
        ${p._full ? docsHtml(p) : `<div class="sec"><h3>Documents</h3><p class="note">Loading…</p></div>`}
        <div class="sec"><h3>Application</h3><dl class="kv">
          <dt>Case</dt><dd><span class="mono">${esc(p.id)}</span>${copyBtn(p.id)}</dd>
          <dt>Type</dt><dd>${esc(p.type)}</dd>
          <dt>Status</dt><dd>${esc(p.status)}</dd>
          <dt>Filed</dt><dd>${fmtDate(p.applied)}</dd>
          ${p.planner ? `<dt>Review planner</dt><dd>${esc(p.planner)}</dd>` : ""}
          ${p.expires ? `<dt>Expires</dt><dd>${fmtDate(p.expires)}</dd>` : ""}
        </dl></div>
        <div class="sec"><h3>Players</h3><dl class="kv">
          <dt>Applicant</dt><dd>${p.applicant ? `<b>${esc(p.applicant)}</b>${p.applicant_source && p.applicant_source !== "board agenda" ? `<div class="note">From ${esc(p.applicant_source)}${p.applicant_doc ? ` (${esc(p.applicant_doc.slice(0, 60))}${p.applicant_doc.length > 60 ? "…" : ""})` : ""}</div>` : ""}` : `<span class="note">Not named yet: no agenda and no application form or disclosure posted online</span>`}</dd>
          <dt>Attorney</dt><dd>${p.attorney ? esc(p.attorney) : "—"}</dd>
          <dt>Tax bill to</dt><dd>${p.owner_mail ? esc(titleCase(p.owner_mail)) + (sameMail.length ? `<div class="note">Same mailing address on ${sameMail.length} other ${sameMail.length === 1 ? "case" : "cases"}</div>` : "") : "—"}</dd>
        </dl></div>
        <div class="sec"><h3>Timeline</h3><ol class="timeline">${hist.map((h) => `<li><span>${esc(h[0])}</span><time>${fmtDate(h[1])}</time></li>`).join("")}</ol></div>
        <div class="hist-head">Property history</div>
        ${p._full ? priorsHtml(p) + newsHtml(p) + salesHtml(p) : `<p class="note">Loading…</p>`}
        ${p.prop_class || p.net_value ? `<div class="sec"><h3>Tax record</h3><dl class="kv">
          ${(p.existing || []).length ? `<dt>Existing use</dt><dd>${esc(existText(p))}${nLots(p) > 1 ? ` <span class="note">(across ${nLots(p)} lots)</span>` : ""}<div class="note">Current tax class: what's there now, not what's proposed</div></dd>` : p.class_label ? `<dt>Existing use</dt><dd>${esc(p.prop_class)} · ${esc(p.class_label)}</dd>` : ""}
          ${p.prop_loc ? `<dt>Tax address</dt><dd>${esc(titleCase(p.prop_loc))}</dd>` : ""}
          ${p.net_value ? `<dt>Assessed</dt><dd>${money(p.net_value)}<div class="note">Land ${short$(p.land_val)} · Improvements ${short$(p.imprvt_val)}</div></dd>` : ""}
          ${nLots(p) > 1 ? `<dt>Assemblage</dt><dd><b>${nLots(p)} lots</b> · ${esc(p.lots_label)}${p.lots_acre ? `<div>${(+p.lots_acre).toFixed(2)} acres · ${n0(Math.round(p.lots_acre * 43560))} SF combined</div>` : ""}${p.lots_net ? `<div class="note">Assessed ${short$(p.lots_net)} across all lots</div>` : ""}</dd>` : ""}
          ${p.calc_acre ? `<dt>${nLots(p) > 1 ? "Main lot" : "Lot size"}</dt><dd>${(+p.calc_acre).toFixed(2)} acres · ${n0(Math.round(p.calc_acre * 43560))} SF</dd>` : ""}
          ${p.bldg_desc ? `<dt>Building</dt><dd class="mono">${esc(p.bldg_desc)}</dd>` : ""}
          ${p.yr_constr ? `<dt>Year built</dt><dd>${esc(p.yr_constr)}</dd>` : ""}
          ${p.last_sale_price ? `<dt>Last sale</dt><dd>${money(p.last_sale_price)}${p.last_sale_date ? " · " + fmtDate(p.last_sale_date) : ""}</dd>` : ""}
          ${p.units && (p.lots_acre || p.calc_acre) ? `<dt>Density</dt><dd>${Math.round(p.units / (p.lots_acre || p.calc_acre))} units / acre</dd>` : ""}
        </dl></div>` : ""}
        <div class="links">
          <a href="${PORTAL + esc(p.case_id)}?tab=attachments" target="_blank" rel="noopener">City portal &amp; plans</a>
          <a href="https://www.google.com/maps/search/?api=1&query=${ll}" target="_blank" rel="noopener">Google Maps</a>
          ${p.lat != null ? `<a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${p.lat},${p.lon}" target="_blank" rel="noopener">Street View</a>` : ""}
        </div>
        ${p.lat == null ? `<p class="note">Not on the map: this case covers a plan area or citywide change rather than one parcel.</p>` : p.geo_source === "address" ? `<p class="note">Placed by street address; the parcel number on file didn't match the state tax map.</p>` : ""}
      </div>`;
    $("#d-close").onclick = closeDetail;
    $("#detail").querySelectorAll(".copy").forEach((b) => (b.onclick = async () => {
      try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; } catch { b.textContent = b.dataset.copy; }
      setTimeout(() => (b.textContent = "Copy"), 1500);
    }));
    $("#detail").querySelectorAll(".related button, .linkish").forEach((b) => (b.onclick = () => select(b.dataset.id, true)));
  }

  function select(id, fly) {
    const p = DATA.cases.find((x) => x.id === id);
    if (!p) return;
    const prev = selected;
    selected = id;
    [prev, id].forEach((pid) => { const m = markers.get(pid); if (m) m.setIcon(pinIcon(m._p)); });
    renderDetail(p);
    const base = buildsOn(p);
    const need = [p, base && !base.external ? base : null].filter((x) => x && !x._full);
    if (need.length) Promise.all(need.map(ensureDetail)).then(() => { if (selected === p.id) { const y = $("#detail").scrollTop; renderDetail(p); $("#detail").scrollTop = y; } });
    $("#detail").hidden = false;
    $("#detail").scrollTop = 0;
    if (window.matchMedia("(max-width: 760px)").matches) $("#side").classList.add("collapsed");
    renderList();
    if (outline) { outline.remove(); outline = null; }
    if (p.lat != null) {
      const z = Math.max(map.getZoom(), 18);
      const pt = map.project([p.lat, p.lon], z);
      const offset = window.matchMedia("(max-width: 760px)").matches ? L.point(0, map.getSize().y * 0.25) : L.point(190, 0);
      const target = map.unproject(pt.add(offset), z);
      fly ? map.flyTo(target, z, { duration: 1.1 }) : map.setView(target, z);
      drawParcel(p);
    }
  }

  // Tax lots for a set of PAMS PINs, as GeoJSON features tagged _kind:
  //   "lot"    the block/lot itself (condo and parking units are drawn as their whole lot);
  //   "unit"   a condo unit with a real footprint on the state map (e.g. one tower of a multi-tower lot);
  //   "parent" the lot a new subdivided lot came from, when the state map doesn't have the new lot yet.
  const LOT_URL = "https://services2.arcgis.com/XVOqAjTOJ5P6ngMu/arcgis/rest/services/Parcels_Composite_NJ_WM/FeatureServer/0/query";
  const baseLot = (pin) => String(pin).split("_").slice(0, 3).join("_");
  const parentLot = (pin) => { const [m, b, l] = String(pin).split("_"); return l && l.includes(".") ? `${m}_${b}_${l.split(".")[0]}` : null; };
  const sqm = (g) => { let t = 0; const polys = g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : []; for (const poly of polys) { const r = poly[0]; let a = 0; for (let i = 0; i < r.length - 1; i++) a += r[i][0] * r[i + 1][1] - r[i + 1][0] * r[i][1]; t += Math.abs(a) / 2 * 84300 * 110574; } return t; };
  async function lotQuery(pins) {
    if (!pins.length) return [];
    const r = await fetch(LOT_URL, { method: "POST", body: new URLSearchParams({ where: `PAMS_PIN IN (${pins.map((x) => `'${String(x).replace(/'/g, "''")}'`).join(",")})`, outFields: "PAMS_PIN,PCLBLOCK,PCLLOT", returnGeometry: "true", outSR: "4326", f: "geojson" }) });
    return (await r.json()).features || [];
  }
  async function lotFeatures(pins) {
    pins = [...new Set(pins.filter(Boolean))];
    const bases = [...new Set(pins.map(baseLot))];
    const got = await lotQuery([...new Set([...pins, ...bases])]);
    const by = Object.fromEntries(got.filter((f) => f.geometry).map((f) => [f.properties.PAMS_PIN, f]));
    const out = new Map();
    for (const pin of pins) {
      const base = baseLot(pin);
      if (base !== pin) {
        if (by[base]) out.set(base, { ...by[base], properties: { ...by[base].properties, _kind: "lot" } });
        if (by[pin] && sqm(by[pin].geometry) >= 200) out.set(pin, { ...by[pin], properties: { ...by[pin].properties, _kind: "unit" } });
      } else if (by[pin]) out.set(pin, { ...by[pin], properties: { ...by[pin].properties, _kind: "lot" } });
    }
    const missing = pins.filter((p) => !out.has(baseLot(p)) && !out.has(p));
    const parents = [...new Set(missing.map(parentLot).filter(Boolean))];
    if (parents.length) for (const f of await lotQuery(parents)) if (f.geometry) out.set(f.properties.PAMS_PIN, { ...f, properties: { ...f.properties, _kind: "parent" } });
    return [...out.values()];
  }
  const LOT_STYLE = { lot: { weight: 2.5, fillOpacity: 0.14, dashArray: "6 4" }, unit: { weight: 2, fillOpacity: 0.32, dashArray: null }, parent: { weight: 2, fillOpacity: 0.08, dashArray: "2 5" } };

  async function drawParcel(p) {
    const pins = (p.parcel_pins && p.parcel_pins.length ? p.parcel_pins : [p.pams_pin]).filter(Boolean);
    if (!pins.length) return;
    const want = p.id;
    try {
      const local = DATA.parcels ? pins.map((x) => DATA.parcels[x]).filter(Boolean) : [];
      const gj = local.length ? { type: "FeatureCollection", features: local } : { type: "FeatureCollection", features: await lotFeatures(pins) };
      if (selected !== want || !gj.features?.length) return;
      if (outline) outline.remove();
      const many = gj.features.filter((f) => f.properties?._kind !== "unit").length > 1;
      outline = L.geoJSON(gj, {
        style: (f) => ({ color: f.properties?._kind === "parent" ? "#ffb347" : "#ffe066", fillColor: "#ffe066", ...(LOT_STYLE[f.properties?._kind] || LOT_STYLE.lot) }), interactive: false,
        onEachFeature: (f, layer) => { const pr = f.properties || {}; if (pr.PCLLOT) layer.bindTooltip(pr._kind === "parent" ? `Lot ${pr.PCLLOT} (before subdivision)` : pr._kind === "unit" ? "Building footprint" : many ? `Lot ${pr.PCLLOT}` : `Block ${pr.PCLBLOCK} · Lot ${pr.PCLLOT}`, { permanent: gj.features.length <= 12, direction: "center", className: "lot-label" }); },
      }).addTo(map);
      if (many) {
        const mobile = window.matchMedia("(max-width: 760px)").matches;
        map.fitBounds(outline.getBounds(), { paddingTopLeft: mobile ? [20, 20] : [40, 40], paddingBottomRight: mobile ? [20, map.getSize().y * 0.5] : [420, 40], maxZoom: 19 });
      }
    } catch { /* outline is a nice-to-have */ }
  }

  function closeDetail() {
    const prev = selected;
    selected = null;
    $("#detail").hidden = true;
    if (outline) { outline.remove(); outline = null; }
    const m = markers.get(prev); if (m) m.setIcon(pinIcon(m._p));
    renderList();
  }

  function refresh() { drawMarkers(); renderList(); }

  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast"; t.innerHTML = msg;
    $(".body").appendChild(t);
    setTimeout(() => t.remove(), 6000);
  }

  function fitCity() {
    const b = cityLayer ? cityLayer.getBounds() : null;
    if (b) map.fitBounds(b, { padding: [30, 30] });
    else { const pts = DATA.cases.filter((p) => p.lat != null).map((p) => [p.lat, p.lon]); if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 14 }); }
  }

  async function start() {
    const emb = document.getElementById("jc-data");
    DATA = emb ? JSON.parse(emb.textContent) : await (await fetch("data/map.json", { cache: "no-store" })).json();
    NOW = new Date(DATA.generated_at);
    LAST_VISIT = store.get("jcbt:lastVisit");
    try {
      const embB = document.getElementById("jc-bounds");
      BOUNDS = embB ? JSON.parse(embB.textContent) : await (await fetch("data/boundaries.json", { cache: "no-store" })).json();
    } catch { BOUNDS = null; }
    initMap();
    drawCity();
    renderStats(); renderFilters(); renderLegend(); renderFoot(); refresh();
    fitCity();
    const fresh = LAST_VISIT ? DATA.cases.filter((p) => p.applied > LAST_VISIT.slice(0, 10)).length : 0;
    if (fresh) toast(`<b>${fresh} new application${fresh === 1 ? "" : "s"}</b> since your last visit`);
    store.set("jcbt:lastVisit", DATA.generated_at);
    if (window.matchMedia("(max-width: 760px)").matches) $("#side").classList.add("collapsed");
    const h = decodeURIComponent(location.hash.slice(1));
    if (/^[PZ](\d{4}|\d{2})-\d{3,4}$/.test(h)) select(h, false);
  }
  start();
})();
</script>
</body>
</html>
