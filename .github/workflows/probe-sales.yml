name: Probe SR1A sales file (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -e
          curl -sSL -o s.zip https://www.nj.gov/treasury/taxation/lpt/statdata/Sales2025.zip
          ls -la s.zip; unzip -l s.zip | head
          unzip -o -q s.zip -d s; f=$(ls s/* | head -1); wc -l "$f"; awk '{print length($0)}' "$f" | sort | uniq -c | sort -rn | head -3
          echo "--- Jersey City (county 09, district 06) sample, positions: price 38-46, grantor 110-144, grantee 204-238, loc 298-322, deed date 339-344, block 351-355, lot 360-364, class 627-628"
          grep -a '^0906' "$f" | head -400 | awk '{printf "%s | %s | %s | %s | %s | B%s L%s | %s\n", substr($0,38,9), substr($0,110,35), substr($0,204,35), substr($0,298,25), substr($0,339,6), substr($0,351,5), substr($0,360,5), substr($0,627,2)}' | grep -E "4A|4B|4C| 1 " | head -25
          echo "JC records: $(grep -ac '^0906' "$f")"
          echo "blank grantee names among JC: $(grep -a '^0906' "$f" | awk '{g=substr($0,204,35); if (g ~ /^ *$/) n++} END{print n+0}')"
          curl -sSI https://www.nj.gov/treasury/taxation/lpt/statdata/Sales2020.zip | grep -i content-length || true
