name: Probe deed search access (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q requests
      - shell: python
        run: |
          import requests, json, datetime
          s = requests.Session(); s.headers["User-Agent"] = "Mozilla/5.0 (JC Board Tracker)"
          B = "https://acclaim.hcnj.us/AcclaimWeb/"
          r = s.get(B + "search/SearchTypeDocLegal", timeout=60); print("legal page", r.status_code, r.url[-60:])
          r = s.post(B + "Search/Disclaimer?st=/AcclaimWeb/search/SearchTypeDocLegal", data={"disclaimer": "true"}, timeout=60); print("accept", r.status_code)
          today = datetime.date.today().strftime("%-m/%-d/%Y")
          form = {"DateRangeList": " ", "RecordDateFrom": "1/1/1950", "RecordDateTo": today, "Block": "21701", "Lot": "18", "LotFilter": "1",
                  "SubdivisionFilter": "0", "TownshipFilter": "0", "CondoFilter": "0", "BookTypesDisplay": "All", "BookTypes": "All"}
          h = {"X-Requested-With": "XMLHttpRequest"}
          r = s.post(B + "search/SearchTypeDocLegal?Length=6", data=form, headers=h, timeout=60); print("search", r.status_code)
          g = s.post(B + "Search/GridResults", data={"page": 1, "size": 500, "orderBy": "~", "groupBy": "~", "filter": "~"}, headers=h, timeout=60)
          j = g.json(); print("grid", g.status_code, "total", j.get("total"))
          for x in (j.get("data") or [])[:4]: print(x.get("RecordDate"), x.get("DirectName"), "->", x.get("IndirectName"), x.get("DocTypeDescription"), x.get("BookPage"))
