name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          for u in \
            "https://jerseydigs.com/wp-json/wp/v2/posts?search=417%20Communipaw&_fields=id,date,link,title&per_page=5" \
            "https://jerseydigs.com/wp-json/wp/v2/posts?search=jersey%20city&per_page=1&_fields=id" \
            "https://re-nj.com/wp-json/wp/v2/posts?search=Communipaw&_fields=id,date,link,title&per_page=5" \
            "https://www.roi-nj.com/wp-json/wp/v2/posts?search=Communipaw&_fields=id,date,link,title&per_page=5" \
            "https://www.roi-nj.com/?s=Communipaw" \
            "https://traded.co/sitemap.xml" \
            "https://traded.co/robots.txt" \
            "https://traded.co/deals/new-jersey/development-site/sale/829-bergen-avenue/" \
            "https://webapi.legistar.com/v1/jerseycity/matters?\$top=2" \
            "https://webapi.legistar.com/v1/cityofjerseycity/matters?\$top=2" \
            "https://cityofjerseycity.legistar.com/Calendar.aspx" ; do
            echo "=== $u"
            curl -sS -A "$UA" -D /tmp/h -o /tmp/b -w "%{http_code} %{size_download}\n" --max-time 40 "$u" || true
            grep -iE "^(x-wp-total|x-wp-totalpages|content-type|location):" /tmp/h || true
            head -c 900 /tmp/b; echo
          done
