name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && python probe/p.py
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh release view research >/dev/null 2>&1 || gh release create research --title "Research files" --notes "Working files, not part of the map" --draft
          gh release upload research out/*.pdf --clobber
