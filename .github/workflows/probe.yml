name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests pillow shapely && python probe/sat.py
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release upload research out/*.jpg --clobber
