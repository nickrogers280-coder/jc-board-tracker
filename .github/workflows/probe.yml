name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          curl -sS -A "$UA" -D - -o /dev/null "https://www.roi-nj.com/wp-json/wp/v2/posts?search=jersey%20city&per_page=1&_fields=id&after=2018-01-01T00:00:00" | grep -i x-wp-total
          curl -sS -A "$UA" "https://jerseydigs.com/wp-json/wp/v2/posts?search=jersey%20city&per_page=100&_fields=id,date,link,title,excerpt,content" -o jd.json -w "%{http_code} %{size_download} %{time_total}\n"
          echo "=== traded page"
          curl -sS -A "$UA" "https://traded.co/deals/new-jersey/development-site/sale/829-bergen-avenue/" -o t.html
          grep -o '<title>[^<]*' t.html; grep -o '<meta[^>]*\(description\|og:\)[^>]*>' t.html | head -8
          python3 - <<'PY'
          import re,json
          s=open('t.html').read()
          m=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',s,re.S)
          if m:
            d=json.loads(m.group(1)); 
            def walk(o,p=''):
              if isinstance(o,dict):
                for k,v in o.items(): walk(v,p+'.'+k)
              elif isinstance(o,list):
                for i,v in enumerate(o[:3]): walk(v,p+'[%d]'%i)
              else:
                if isinstance(o,(str,int,float)) and len(str(o))<150: print(p[:120],'=',str(o)[:100])
            walk(d.get('props',{}).get('pageProps',{}))
          for m in re.finditer(r'<script type="application/ld\+json">(.*?)</script>',s,re.S): print('LD',m.group(1)[:800])
          PY
          echo "=== google news"
          curl -sS -A "$UA" "https://news.google.com/rss/search?q=%22417+Communipaw%22+site:re-nj.com&hl=en-US&gl=US&ceid=US:en" | python3 -c "
          import sys,re;s=sys.stdin.read();print(len(s))
          for it in re.findall(r'<item>(.*?)</item>',s,re.S)[:5]: print(re.findall(r'<(title|link|pubDate|source)[^>]*>(.*?)</',it))"
          curl -sS -A "$UA" "https://news.google.com/rss/search?q=%22Communipaw%22+%22Jersey+City%22+site:traded.co&hl=en-US&gl=US&ceid=US:en" | python3 -c "
          import sys,re;s=sys.stdin.read()
          for it in re.findall(r'<item>(.*?)</item>',s,re.S)[:3]: print(re.findall(r'<(title|link|pubDate)[^>]*>(.*?)</',it))"
          curl -sS -A "$UA" "https://traded.co/sitemap.xml" | grep -o "<loc>[^<]*" 
          for f in sitemap-deals.xml sitemap-deals-1.xml; do curl -sS -A "$UA" https://traded.co/$f | grep -o "<loc>https://traded.co/deals/new-jersey/[^<]*" > nj_$f.txt; wc -l nj_$f.txt; grep -c jersey-city nj_$f.txt; grep -i communipaw nj_$f.txt; done
