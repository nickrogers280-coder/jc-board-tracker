name: Update and publish JC Board Tracker

on:
  schedule:
    # Every 6 hours (UTC). Picks up new filings, status changes and newly posted board agendas.
    - cron: "23 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q requests pdfplumber

      # Last run's raw pull (parcel matches, geocodes, agenda text) so each run only fetches what's new.
      - uses: actions/cache/restore@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Pull cases, documents and agendas
        timeout-minutes: 200
        run: python fetch.py

      # Save the case pull right away, so a slow deed or document step can never cost it.
      - name: Save the raw pull
        if: always()
        uses: actions/cache/save@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}-cases

      - name: Build and commit the cases first
        run: |
          python build.py
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add data/ index.html kushner.html developers.html
          if ! git diff --cached --quiet; then
            git commit -m "data: cases $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git pull --rebase -X theirs origin main || git pull --rebase origin main
            git push
          fi

      - name: Kushner / KRE buildings (parcels, cases, documents)
        continue-on-error: true
        run: python portfolio.py

      - name: Ownership and sales history (county deed index + state sales file)
        continue-on-error: true
        timeout-minutes: 45
        run: python sales.py

      - name: Copy the current version of each document to the release
        continue-on-error: true   # a document problem never holds back the map update
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: python docs_mirror.py

      - name: Build map data and page
        run: python build.py

      - name: Save the raw pull (deeds, portfolio)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}-all

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add data/ index.html kushner.html developers.html
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: update $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git pull --rebase -X theirs origin main || git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: update
    # Publish after a data change, or whenever the page itself is pushed.
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/map.json _site/data/map.json
          if [ -f kushner.html ]; then cp kushner.html _site/kushner.html; fi
          if [ -f developers.html ]; then cp developers.html _site/developers.html; fi
          if [ -f data/portfolio.json ]; then cp data/portfolio.json _site/data/portfolio.json; fi
          if [ -f data/boundaries.json ]; then cp data/boundaries.json _site/data/boundaries.json; fi
          if [ -d data/detail ]; then cp -r data/detail _site/data/detail; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
